<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CBX vs. The World</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f1f3f 0%, #1a2f5f 100%); }
    .auth-card { background: var(--color-dark-lightest); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-2xl); width: 100%; max-width: 450px; }
    .auth-card h1 { color: var(--color-primary); margin-bottom: var(--space-lg); text-align: center; }
    .text-center { margin: var(--space-lg) 0; color: var(--color-text-muted); text-align: center; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Sign In</h1>
      <div id="error-message" class="alert alert-error hidden"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-full" style="padding: var(--space-lg) var(--space-2xl);">Sign In</button>
      </form>
      <div class="text-center">
        Don't have an account? <a href="/pages/auth/signup.html">Sign up here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config.js"></script>
  <script src="../../app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          document.getElementById('error-message').textContent = error.message;
          document.getElementById('error-message').classList.remove('hidden');
          return;
        }
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/index.html';
        window.location.href = redirect;
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
