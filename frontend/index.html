<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBX vs. The World</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hero { padding: 64px 16px; text-align: center; background: linear-gradient(135deg, #0f1f3f 0%, #1a2f5f 100%); }
    .hero h1 { font-size: 3rem; color: white; margin-bottom: 16px; }
    .hero .highlight { color: #c7ff00; }
    .hero p { font-size: 20px; color: #8899bb; max-width: 600px; margin: 0 auto 48px; }
    .hero-buttons { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
    .stats { padding: 48px 16px; background: #1a2f5f; border-top: 2px solid #c7ff00; border-bottom: 2px solid #c7ff00; }
    .stats-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; text-align: center; }
    .stat-item h3 { font-size: 32px; color: #c7ff00; margin-bottom: 8px; }
    .stat-item p { color: #8899bb; text-transform: uppercase; font-size: 12px; margin: 0; }
    .battle-section { padding: 48px 16px; }
    .battle-card { max-width: 1000px; margin: 0 auto; background: #2a3f6f; border: 2px solid #3a4f7f; border-radius: 16px; padding: 48px; }
    .battle-contenders { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; margin-bottom: 48px; }
    .contender { background: #0f1f3f; border: 1px solid #3a4f7f; border-radius: 8px; padding: 24px; text-align: center; }
    .contender img { width: 150px; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 16px; }
    .contender h3 { color: #c7ff00; margin-bottom: 8px; }
    .vs { font-size: 32px; font-weight: 900; color: #c7ff00; }
    .upcoming { max-width: 1200px; margin: 0 auto; padding: 48px 16px; }
    .upcoming-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .upcoming-card { background: #2a3f6f; border: 1px solid #3a4f7f; border-radius: 16px; padding: 24px; cursor: pointer; }
    @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .battle-contenders { grid-template-columns: 1fr; } .upcoming-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="/index.html" class="nav-logo">CBX VS. WORLD</a>
      <div id="nav-auth"></div>
    </div>
  </nav>

  <section class="hero">
    <h1>THE BEST FLOWER<br/>DOESN'T GET <span class="highlight">CROWNED.</span><br/>IT GETS <span class="highlight">JUDGED.</span></h1>
    <p>Head-to-head battles, scored round by round by the people who actually smoke it.</p>
    <div class="hero-buttons">
      <button class="btn" onclick="goToJudging()">JUDGE THE LIVE BATTLE</button>
      <button class="btn btn-secondary">SEE THE FIGHT CARD</button>
    </div>
  </section>

  <section class="stats">
    <div class="stats-grid">
      <div class="stat-item"><h3 id="stat-judges">0</h3><p>Judges</p></div>
      <div class="stat-item"><h3 id="stat-battles">0</h3><p>Battles Settled</p></div>
      <div class="stat-item"><h3 id="stat-rounds">0</h3><p>Rounds Scored</p></div>
      <div class="stat-item"><h3 id="stat-days">12</h3><p>Days Left</p></div>
    </div>
  </section>

  <section class="battle-section">
    <div class="battle-card" id="main-battle">
      <div class="spinner" style="margin: 50px auto; width: 50px; height: 50px;"></div>
      <p style="text-align: center; color: #8899bb;">Loading battle...</p>
    </div>
  </section>

  <section class="upcoming">
    <h2 style="margin-bottom: 24px;">NEXT BATTLES</h2>
    <div class="upcoming-grid" id="upcoming-battles"></div>
  </section>

  <footer style="text-align: center; padding: 48px 16px; border-top: 1px solid #3a4f7f; color: #8899bb;">
    <p>&copy; 2026 CBX vs. The World.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    async function pageInit() {
      await loadStats();
      await loadMainBattle();
      await loadUpcomingBattles();
    }

    async function loadStats() {
      try {
        const { count: judges } = await window.supabaseClient.from('judge_profiles').select('*', { count: 'exact' });
        const { count: battles } = await window.supabaseClient.from('battle_results').select('*', { count: 'exact' });
        const { count: scores } = await window.supabaseClient.from('judge_scores').select('*', { count: 'exact' });
        document.getElementById('stat-judges').textContent = judges || 0;
        document.getElementById('stat-battles').textContent = battles || 0;
        document.getElementById('stat-rounds').textContent = scores || 0;
      } catch (err) { console.error(err); }
    }

    async function loadMainBattle() {
      try {
        const { data: battle } = await window.supabaseClient.from('battles').select('id, battle_number, status, battle_products!inner(role, product:products(id, name, cultivar, image_url))').eq('status', 'open').limit(1).single();
        if (!battle) {
          document.getElementById('main-battle').innerHTML = '<p style="text-align: center; color: #8899bb; padding: 48px;">No active battles.</p>';
          return;
        }
        const [a, b] = battle.battle_products;
        document.getElementById('main-battle').innerHTML = `<h2 style="margin-bottom: 24px;">Smoke-off #${String(battle.battle_number).padStart(3, '0')}</h2><div class="battle-contenders"><div class="contender"><img src="${a.product.image_url}" alt="${a.product.name}"><h3>${a.product.name}</h3><p style="color: #8899bb; font-size: 12px; margin: 0;">${a.product.cultivar || 'Unknown'}</p></div><div class="vs">VS</div><div class="contender"><img src="${b.product.image_url}" alt="${b.product.name}"><h3>${b.product.name}</h3><p style="color: #8899bb; font-size: 12px; margin: 0;">${b.product.cultivar || 'Unknown'}</p></div></div><button class="btn" style="width: 100%; padding: 24px;" onclick="goToJudging('${battle.id}')">JUDGE THIS BATTLE</button>`;
      } catch (err) { console.error(err); }
    }

    async function loadUpcomingBattles() {
      try {
        const { data: battles } = await window.supabaseClient.from('battles').select('id, battle_number, battle_products!inner(role, product:products(name))').eq('status', 'scheduled').order('opens_at', { ascending: true }).limit(3);
        if (!battles || battles.length === 0) {
          document.getElementById('upcoming-battles').innerHTML = '<p style="color: #8899bb;">No upcoming battles.</p>';
          return;
        }
        document.getElementById('upcoming-battles').innerHTML = battles.map(b => {
          const [a, c] = b.battle_products;
          return `<div class="upcoming-card"><h3 style="color: #c7ff00;">Smoke-off #${String(b.battle_number).padStart(3, '0')}</h3><p><strong>${a.product.name}</strong> vs <strong>${c.product.name}</strong></p></div>`;
        }).join('');
      } catch (err) { console.error(err); }
    }

    async function goToJudging(battleId) {
      const loggedIn = await window.supabaseHelpers.isLoggedIn();
      if (!loggedIn) {
        window.location.href = '/pages/auth/login.html?redirect=/pages/judging.html?id=' + battleId;
      } else {
        window.location.href = '/pages/judging.html?id=' + battleId;
      }
    }

    window.goToJudging = goToJudging;
  </script>
</body>
</html>
